<!DOCTYPE html>
<html>

<head>

    <title>Condóminos</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet">

    <link rel="stylesheet" href="css/styles.css">

</head>

<body>

<div class="sidebar">

    <div class="text-center mb-3">

    <img
        src="logo-empresa.png"
        width="140">

</div>

<h2 class="text-center">
    Condominios
</h2>

    <button
        class="btn btn-danger w-100 mb-3"
        onclick="salir()">

        Salir

    </button>

    <a
        href="dashboard.html">

        🏠 Dashboard

    </a>

    <a href="condominios.html">

        🏢 Condominios

    </a>

    <a href="condominos.html"
        class="active">

        👥 Condóminos

    </a>

    <a href="pagos.html">

        💰 Pagos

    </a>

</div>

<div class="content">

    <h1 class="mb-4">
        Condóminos
    </h1>

    <div class="mb-4">

        <input
            id="busqueda"
            class="form-control"
            placeholder="Buscar condómino..."
            onkeyup="filtrar()">

    </div>

    <div class="card shadow p-4 mb-4">

        <div class="row g-3">

            <div class="col-md-3">

                <input
                    id="nombre"
                    class="form-control"
                    placeholder="Nombre">

            </div>

            <div class="col-md-3">

                <input
                    id="departamento"
                    class="form-control"
                    placeholder="Unidad">

            </div>

            <div class="col-md-3">

                <input
                    id="torre"
                    class="form-control"
                    placeholder="Privada/Torre">

            </div>

            <div class="col-md-2">

                <input
                    id="telefono"
                    class="form-control"
                    placeholder="Teléfono">

            </div>

            <div class="col-md-3">

                <input
                    id="correo"
                    class="form-control"
                    placeholder="Correo">

            </div>

            <div class="col-md-2">

                <select
                    id="condominioId"
                    class="form-control">

                </select>

            </div>

        </div>

        <button
            id="btnGuardar"
            class="btn btn-primary mt-3"
            onclick="guardar()">

            Guardar

        </button>

        <button
            class="btn btn-secondary mt-2"
            onclick="cargarInactivos()">

            Ver inactivos

        </button>

    </div>

    <table class="table table-bordered bg-white">

        <thead>

            <tr>

                <th>ID</th>
                <th>Nombre</th>
                <th>Unidad</th>
                <th>Privada/Torre</th>
                <th>Teléfono</th>
                <th>Correo</th>
                <th>Saldo favor</th>
                <th>Condominio</th>
                <th>Acciones</th>

            </tr>

        </thead>

        <tbody id="tabla"></tbody>

    </table>

    <div
        class="d-flex justify-content-between align-items-center mt-3">

        <button
            class="btn btn-secondary"
            onclick="anterior()">

            ← Anterior

        </button>

        <span id="paginaActual">

            Página 1

        </span>

        <button
            class="btn btn-secondary"
            onclick="siguiente()">

            Siguiente →

        </button>

    </div>

</div>

<div
    id="toast"
    class="toast align-items-center text-white bg-success border-0 position-fixed bottom-0 end-0 m-4"
    role="alert"
    style="z-index:9999;">

    <div class="d-flex">

        <div
            id="toastMensaje"
            class="toast-body">

            Guardado correctamente

        </div>

        <button
            type="button"
            class="btn-close btn-close-white me-2 m-auto"
            data-bs-dismiss="toast">

        </button>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<script src="js/seguridad.js"></script>

<script>


let editandoId = null;

let condominosData = [];

let pagina = 1;

const limite = 5;

async function cargarCondominios(){

    const response = await fetch(
        "http://localhost:3000/api/condominios",
        {
            headers:{
                Authorization: token
            }
        }
    );

    const data = await response.json();

    let html = "";

    data.forEach(c => {

        html += `
            <option value="${c.id}">
                ${c.nombre}
            </option>
        `;

    });

    condominioId.innerHTML = html;

}

async function cargar(){

    const response = await fetch(
        "http://localhost:3000/api/condominos",
        {
            headers:{
                Authorization: token
            }
        }
    );

    const data = await response.json();

    condominosData = data;

    renderTabla(condominosData);

}

async function cargarInactivos(){

    const response =
        await fetch(

        "http://localhost:3000/api/condominos/inactivos",

        {
            headers:{
                Authorization: token
            }
        }

    );

    const data =
        await response.json();

    renderTablaInactivos(data);

}

function renderTablaInactivos(data){

    tabla.innerHTML = "";

    data.forEach(c => {

        tabla.innerHTML += `

        <tr>

            <td>${c.id}</td>

            <td>${c.nombre}</td>

            <td>${c.departamento || ""}</td>

            <td>${c.torre || ""}</td>

            <td>${c.telefono || ""}</td>

            <td>${c.correo || ""}</td>

            <td>
                $ ${parseFloat(
                    c.saldoFavor || 0
                ).toFixed(2)}
            </td>

            <td>
                ${c.condominio?.nombre || ""}
            </td>

            <td>

                <button
                    class="btn btn-success btn-sm"
                    onclick="reactivar(${c.id})">

                    Reactivar

                </button>

            </td>

        </tr>

        `;

    });

}

async function reactivar(id){

    await fetch(

        "http://localhost:3000/api/condominos/" +
        id +
        "/reactivar",

        {

            method:"PUT",

            headers:{
                Authorization: token
            }

        }

    );

    mostrarToast(
        "Condómino reactivado"
    );

    cargar();

}

function renderTabla(data){

    const inicio =
        (pagina - 1) * limite;

    const fin =
        inicio + limite;

    const registros =
        data.slice(inicio, fin);

    let html = "";

    registros.forEach(c => {

        html += `
        <tr>

            <td>${c.id}</td>

            <td>${c.nombre}</td>

            <td>${c.departamento || ""}</td>

            <td>${c.torre || ""}</td>

            <td>${c.telefono || ""}</td>

            <td>${c.correo || ""}</td>

            <td>

                $ ${parseFloat(
                    c.saldoFavor || 0
                ).toFixed(2)}

            </td>

            <td>${c.condominio.nombre}</td>

            <td>

                <button
                    class="btn btn-warning btn-sm me-2"
                    onclick="editar(${c.id})">

                    Editar

                </button>

                <button
                    class="btn btn-danger btn-sm"
                    onclick="eliminar(${c.id})">

                    Eliminar

                </button>

            </td>

        </tr>
        `;

    });

    tabla.innerHTML = html;

    paginaActual.innerText =
        "Página " + pagina;

}

async function guardar(){

    if(
        !nombre.value.trim() ||
        !departamento.value.trim()
    ){

        mostrarToast(
            "Complete los campos obligatorios",
            "warning"
        );

        return;

    }

    btnGuardar.disabled = true;

    const existe = condominosData.find(c =>

        c.nombre.toLowerCase().trim()
        ===
        nombre.value.toLowerCase().trim()

        &&

        c.departamento
            ?.toLowerCase()
            .trim()

        ===

        departamento.value
            .toLowerCase()
            .trim()

        &&

        c.id !== editandoId

    );

    if(existe){

        mostrarToast(
            "El condómino ya existe",
            "danger"
        );

        btnGuardar.disabled = false;

        return;

    }

    const url = editandoId
        ? "http://localhost:3000/api/condominos/" + editandoId
        : "http://localhost:3000/api/condominos";

    const method = editandoId
        ? "PUT"
        : "POST";

    await fetch(
        url,
        {
            method,
            headers:{
                "Content-Type":"application/json",
                Authorization: token
            },
            body: JSON.stringify({
                nombre: nombre.value.trim(),
                departamento: departamento.value.trim(),
                torre: torre.value.trim(),  
                telefono: telefono.value.trim(),
                correo: correo.value.trim(),
                condominioId: condominioId.value
            })
        }
    );

    nombre.value = "";

    departamento.value = "";

    torre.value = "";

    telefono.value = "";

    correo.value = "";

    editandoId = null;

    btnGuardar.disabled = false;

    mostrarToast(
        "Condómino guardado correctamente"
    );

    cargar();

}

async function editar(id){

    const condomino =
        condominosData.find(
            c => c.id === id
        );

    if(!condomino)
        return;

    editandoId = id;

    nombre.value = condomino.nombre;

    departamento.value = condomino.departamento || "";

    torre.value = condomino.torre || "";

    telefono.value = condomino.telefono || "";

    correo.value = condomino.correo || "";

    condominioId.value =
        condomino.condominioId;

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });

}

async function eliminar(id){

    if(!confirm("¿Eliminar condómino?"))
        return;

    await fetch(
        "http://localhost:3000/api/condominos/" + id,
        {
            method:"DELETE",
            headers:{
                Authorization: token
            }
        }
    );

    mostrarToast(
        "Condómino eliminado"
    );

    cargar();

}

function filtrar(){

    const texto =
        busqueda.value.toLowerCase();

    const filtrados =
        condominosData.filter(c =>

            c.nombre
                .toLowerCase()
                .includes(texto)

            ||

            c.departamento
                .toLowerCase()
                .includes(texto)

            ||

            c.telefono
                ?.toLowerCase()
                .includes(texto)

            ||

            c.torre
                ?.toLowerCase()
                .includes(texto)    

        );

    renderTabla(filtrados);

}

function siguiente(){

    const totalPaginas =
        Math.ceil(
            condominosData.length / limite
        );

    if(pagina < totalPaginas){

        pagina++;

        renderTabla(condominosData);

    }

}

function anterior(){

    if(pagina > 1){

        pagina--;

        renderTabla(condominosData);

    }

}

function mostrarToast(
    mensaje,
    tipo = "success"
){

    const toast =
        document.getElementById("toast");

    const toastMensaje =
        document.getElementById(
            "toastMensaje"
        );

    toastMensaje.innerText = mensaje;

    toast.classList.remove(
        "bg-success",
        "bg-danger",
        "bg-warning"
    );

    if(tipo === "success"){

        toast.classList.add(
            "bg-success"
        );

    }

    if(tipo === "danger"){

        toast.classList.add(
            "bg-danger"
        );

    }

    if(tipo === "warning"){

        toast.classList.add(
            "bg-warning"
        );

    }

    const bsToast =
        new bootstrap.Toast(toast);

    bsToast.show();

}

cargarCondominios();

cargar();

</script>

</body>
</html>
